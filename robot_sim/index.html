<!DOCTYPE html>
<html>
<head>
    <title>Robot Digital Twin</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 10px;
            font-family: Arial, sans-serif;
        }

        #controls input {
            width: 180px;
        }
    </style>
</head>

<body>

<div id="controls">

    Base:
    <span id="value">90°</span>
    <br>

    <input
        id="slider"
        type="range"
        min="0"
        max="180"
        value="90"
    >

    <br><br>

    Shoulder:
    <span id="value2">110°</span>
    <br>

    <input
        id="slider2"
        type="range"
        min="0"
        max="180"
        value="110"
    >

    <br><br>

    Elbow:
    <span id="value3">110°</span>
    <br>

    <input
        id="slider3"
        type="range"
        min="0"
        max="180"
        value="110"
    >

    <br><br>

    Wrist:
    <span id="value4">90°</span>
    <br>

    <input
        id="slider4"
        type="range"
        min="0"
        max="180"
        value="90"
    >

    <br><br>

    Gripper:
    <span id="value5">90°</span>
    <br>

    <input
        id="slider5"
        type="range"
        min="0"
        max="180"
        value="90"
    >

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<script type="module">

    import * as THREE from "three";

    import {
        OrbitControls
    } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";


    // ========================================
    // SCENE
    // ========================================

    const scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x202020);


    // ========================================
    // CAMERA
    // ========================================

    const camera =
        new THREE.PerspectiveCamera(
            50,
            window.innerWidth /
            window.innerHeight,
            0.1,
            100
        );

    camera.position.set(
        5,
        4,
        7
    );

    camera.lookAt(
        0,
        1,
        0
    );


    // ========================================
    // RENDERER
    // ========================================

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(
        renderer.domElement
    );


    // ========================================
    // ORBIT CONTROLS
    // ========================================

    const controls =
        new OrbitControls(
            camera,
            renderer.domElement
        );

    controls.target.set(
        0,
        1,
        0
    );

    controls.update();


    // ========================================
    // LIGHTING
    // ========================================

    const light =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    light.position.set(
        5,
        10,
        5
    );

    scene.add(light);

    scene.add(
        new THREE.AmbientLight(
            0xffffff,
            1
        )
    );


    // ========================================
    // ROBOT
    // ========================================

    const robot =
        new THREE.Group();

    scene.add(robot);


    // ========================================
    // JOINT 1 - BASE
    // ========================================

    const joint1 =
        new THREE.Group();

    robot.add(joint1);


    // ========================================
    // ROBOT BASE
    // ========================================

    const baseGeometry =
        new THREE.BoxGeometry(
            2.5,
            0.5,
            2
        );

    const baseMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x3498db
        });

    const base =
        new THREE.Mesh(
            baseGeometry,
            baseMaterial
        );

    base.position.y =
        0.25;

    joint1.add(base);


    // ========================================
    // STATIC CONNECTOR
    // ========================================

    const connectorGeometry =
        new THREE.BoxGeometry(
            0.6,
            1.2,
            0.6
        );

    const connectorMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x3498db
        });

    const connector =
        new THREE.Mesh(
            connectorGeometry,
            connectorMaterial
        );

    connector.position.y =
        1.1;

    joint1.add(connector);


    // ========================================
    // JOINT 2 - SHOULDER
    // ========================================

    const joint2 =
        new THREE.Group();

    joint1.add(joint2);

    joint2.position.y =
        1.7;


    // ========================================
    // UPPER ARM
    // ========================================

    const armGeometry =
        new THREE.BoxGeometry(
            0.6,
            2.5,
            0.6
        );

    const armMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x3498db
        });

    const arm1 =
        new THREE.Mesh(
            armGeometry,
            armMaterial
        );

    arm1.position.y =
        1.25;

    joint2.add(arm1);


    // ========================================
    // JOINT 3 - ELBOW
    // ========================================

    const joint3 =
        new THREE.Group();

    joint3.position.y =
        2.5;

    joint2.add(joint3);


    // ========================================
    // FOREARM
    // ========================================

    const forearmGeometry =
        new THREE.BoxGeometry(
            0.6,
            2.0,
            0.6
        );

    const forearmMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x2980b9
        });

    const forearm =
        new THREE.Mesh(
            forearmGeometry,
            forearmMaterial
        );

    forearm.position.y =
        1.0;

    joint3.add(forearm);


    // ========================================
    // JOINT 4 - WRIST
    // ========================================

    const joint4 =
        new THREE.Group();

    joint4.position.y =
        2.0;

    joint3.add(joint4);


    // ========================================
    // WRIST HOUSING
    // ========================================

    const wristGeometry =
        new THREE.BoxGeometry(
            0.75,
            0.4,
            0.75
        );

    const wristMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x1f6fa8
        });

    const wrist =
        new THREE.Mesh(
            wristGeometry,
            wristMaterial
        );

    wrist.position.y =
        0.2;

    joint4.add(wrist);


    // ========================================
    // GRIPPER BASE
    // ========================================

    const gripperBaseGeometry =
        new THREE.BoxGeometry(
            0.9,
            0.25,
            0.9
        );

    const gripperBaseMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x555555
        });

    const gripperBase =
        new THREE.Mesh(
            gripperBaseGeometry,
            gripperBaseMaterial
        );

    gripperBase.position.y =
        0.5;

    joint4.add(gripperBase);


    // ========================================
    // JOINT 5 - GRIPPER
    // ========================================

    const joint5 =
        new THREE.Group();

    joint5.position.y =
        0.6;

    joint4.add(joint5);


    // ========================================
    // GRIPPER FINGERS
    // ========================================

    const fingerGeometry =
        new THREE.BoxGeometry(
            0.18,
            0.8,
            0.35
        );

    const fingerMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x777777
        });


    // ========================================
    // LEFT FINGER
    // ========================================

    const leftFinger =
        new THREE.Mesh(
            fingerGeometry,
            fingerMaterial
        );

    leftFinger.position.set(
        -0.55,
        0.4,
        0
    );

    joint5.add(leftFinger);


    // ========================================
    // RIGHT FINGER
    // ========================================

    const rightFinger =
        new THREE.Mesh(
            fingerGeometry,
            fingerMaterial
        );

    rightFinger.position.set(
        0.55,
        0.4,
        0
    );

    joint5.add(rightFinger);


    // ========================================
    // TARGET CUBE
    // ========================================

    const cubeGeometry =
        new THREE.BoxGeometry(
            0.8,
            0.8,
            0.8
        );

    const cubeMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xff5533
        });

    const cube =
        new THREE.Mesh(
            cubeGeometry,
            cubeMaterial
        );

    cube.position.set(
        4,
        0.4,
        0
    );

    scene.add(cube);


    // ========================================
    // TABLE / FLOOR
    // ========================================

    const tableGeometry =
        new THREE.PlaneGeometry(
            12,
            12
        );

    const tableMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x777777,
            side: THREE.DoubleSide
        });

    const table =
        new THREE.Mesh(
            tableGeometry,
            tableMaterial
        );

    table.rotation.x =
        -Math.PI / 2;

    scene.add(table);


    // ========================================
    // JOINT 1 - BASE SLIDER
    // ========================================

    const slider =
        document.getElementById(
            "slider"
        );

    const value =
        document.getElementById(
            "value"
        );

    joint1.rotation.y =
        THREE.MathUtils.degToRad(
            90
        );


    slider.addEventListener(
        "input",
        function () {

            const degrees =
                Number(slider.value);

            value.textContent =
                degrees + "°";

            joint1.rotation.y =
                THREE.MathUtils.degToRad(
                    degrees
                );

        }
    );


    // ========================================
    // JOINT 2 - SHOULDER SLIDER
    // ========================================

    const slider2 =
        document.getElementById(
            "slider2"
        );

    const value2 =
        document.getElementById(
            "value2"
        );

    slider2.value =
        110;

    value2.textContent =
        "110°";

    joint2.rotation.x =
        THREE.MathUtils.degToRad(
            110 - 90
        );


    slider2.addEventListener(
        "input",
        function () {

            const degrees =
                Number(slider2.value);

            value2.textContent =
                degrees + "°";

            joint2.rotation.x =
                THREE.MathUtils.degToRad(
                    degrees - 90
                );

        }
    );


    // ========================================
    // JOINT 3 - ELBOW SLIDER
    // ========================================

    const slider3 =
        document.getElementById(
            "slider3"
        );

    const value3 =
        document.getElementById(
            "value3"
        );

    slider3.value =
        110;

    value3.textContent =
        "110°";

    joint3.rotation.x =
        THREE.MathUtils.degToRad(
            110 - 90
        );


    slider3.addEventListener(
        "input",
        function () {

            const degrees =
                Number(slider3.value);

            value3.textContent =
                degrees + "°";

            joint3.rotation.x =
                THREE.MathUtils.degToRad(
                    degrees - 90
                );

        }
    );


    // ========================================
    // JOINT 4 - WRIST SLIDER
    // ========================================

    const slider4 =
        document.getElementById(
            "slider4"
        );

    const value4 =
        document.getElementById(
            "value4"
        );


    joint4.rotation.y =
        THREE.MathUtils.degToRad(
            90 - 90
        );


    slider4.addEventListener(
        "input",
        function () {

            const degrees =
                Number(slider4.value);

            value4.textContent =
                degrees + "°";

            joint4.rotation.y =
                THREE.MathUtils.degToRad(
                    degrees - 90
                );

        }
    );


    // ========================================
    // JOINT 5 - GRIPPER SLIDER
    // ========================================

    const slider5 =
        document.getElementById(
            "slider5"
        );

    const value5 =
        document.getElementById(
            "value5"
        );


    slider5.addEventListener(
        "input",
        function () {

            const degrees =
                Number(slider5.value);

            value5.textContent =
                degrees + "°";


            // ====================================
            // SERVO ANGLE
            //
            // 0°   = closed
            // 180° = fully open
            // ====================================

            const maxOpening =
                0.55;

            const opening =
                maxOpening *
                (degrees / 180);


            leftFinger.position.x =
                -opening;

            rightFinger.position.x =
                opening;

        }
    );


    // ========================================
    // INITIAL GRIPPER POSITION
    // ========================================

    const initialOpening =
        0.55 * (90 / 180);

    leftFinger.position.x =
        -initialOpening;

    rightFinger.position.x =
        initialOpening;


    // ========================================
    // ANIMATION LOOP
    // ========================================

    function animate() {

        requestAnimationFrame(
            animate
        );

        renderer.render(
            scene,
            camera
        );

    }

    animate();


    // ========================================
    // WINDOW RESIZE
    // ========================================

    window.addEventListener(
        "resize",
        function () {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

</script>

</body>
</html>
